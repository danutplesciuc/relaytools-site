<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Relay Tools Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-bg download-page">
    <div class="orb orb-blue"></div>
    <div class="orb orb-purple"></div>

    <main class="download-card">
      <a class="brand" href="index.html">
        <span class="brand-icon">↻</span>
        <span>
          <strong>Relay Tools Pro</strong>
          <small>Secure extension download</small>
        </span>
      </a>

      <h1>Download Extension</h1>
      <p>Enter your license email and key. After verification, the extension download will start automatically.</p>

      <input id="email" type="email" placeholder="Email address">
      <input id="license" type="text" placeholder="License key">

      <button class="btn btn-primary big" onclick="verifyLicense()">Verify License</button>
      <div class="status" id="status"></div>

      <a class="mini-link" href="index.html">Back to homepage</a>
    </main>
  </div>

  <script src="download.js"></script>
</body>
</html>
